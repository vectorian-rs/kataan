[workspace]
members = [
  "crates/kataan-core",
  "crates/kataan-cli",
  "crates/kataan-server",
  "crates/kataan-agent",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/kataan"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
