[package]
name = "kataan-server"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Embed the built web UI (apps/web/dist) into the binary and serve it by
# default. Use `--no-default-features` for an API-only build.
default = ["embed-ui"]
embed-ui = ["dep:rust-embed", "dep:percent-encoding"]

[dependencies]
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }
percent-encoding = { version = "2", optional = true }
anyhow.workspace = true
axum.workspace = true
ammonia = "4"
clap.workspace = true
ignore.workspace = true
kataan-core = { path = "../kataan-core" }
kataan-search = { path = "../kataan-search" }
lumis = { version = "0.9.0", default-features = false, features = ["lang-bash", "lang-c", "lang-cpp", "lang-haskell", "lang-javascript", "lang-json", "lang-markdown", "lang-python", "lang-rust", "lang-toml", "lang-typescript", "lang-yaml"] }
notify = "6"
pulldown-cmark = { version = "0.13" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = "0.5"
tempfile.workspace = true
