[tools]
bun = "1.3.10"

[tasks.install]
description = "Install web dependencies"
run = "bun install"

[tasks.dev]
description = "Install dependencies and run the Astro web app"
run = [
  "bun install",
  "bun dev",
]

[tasks.build]
description = "Install dependencies and build the Astro web app"
run = [
  "bun install",
  "bun build",
]

[tasks.check]
description = "Install dependencies and run Astro type checks"
run = [
  "bun install",
  "bun check",
]
