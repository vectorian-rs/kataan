[tools]
bun = "1.3.10"

[tasks.install]
description = "Install web dependencies"
run = "bun install"

[tasks.dev]
description = "Run the Astro web app"
run = "bun dev"

[tasks.build]
description = "Build the Astro web app"
run = "bun build"

[tasks.check]
description = "Run Astro type checks"
run = "bun check"
