experimental_monorepo_root = true

[monorepo]
config_roots = [
  "apps/web",
]

[tools]
bun = "1.3.10"
rust = { version = "1.91.1", components = "rustfmt,clippy" }

[env]
KATAAN_WEB_PORT = "3003"
KATAAN_API_PROXY_TARGET = "http://127.0.0.1:3001"

[tasks.install]
description = "Install JavaScript dependencies with Bun"
run = "bun install"

[tasks.dev-web]
description = "Run the Astro web app with hot reload"
run = "bun --filter @kataan/web dev"

[tasks.dev-web-install]
description = "Install dependencies and run the Astro web app with hot reload"
run = [
  "bun install",
  "bun --filter @kataan/web dev",
]

[tasks.clear-web]
description = "Stop processes using the default Astro dev port"
run = "lsof -ti :${KATAAN_WEB_PORT:-3000} | xargs -r kill"

[tasks.build-web]
description = "Install dependencies and build the Astro web app"
run = [
  "bun install",
  "bun --filter @kataan/web build",
]

[tasks.check-web]
description = "Install dependencies and run Astro type checks"
run = [
  "bun install",
  "bun --filter @kataan/web check",
]

[tasks.test]
description = "Build the web UI, then run all Rust tests"
# The default `embed-ui` feature makes rust-embed require apps/web/dist at
# compile time, and dist is gitignored, so without this every Rust command
# fails with a `#[derive(RustEmbed)] folder does not exist` error.
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo test --locked",
]

[tasks.build-release]
description = "Build the web UI, then all Rust binaries in release mode"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo build --locked --workspace --release --bins",
]

[tasks.build-app]
description = "Build the web UI and the single kataan-server binary"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo build --locked -p kataan-server --release",
]

[tasks.install-server]
description = "Build the UI and install kataan-server into ~/.cargo/bin"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo install --locked --path crates/kataan-server --force",
]

[tasks.check-release]
description = "Prove the release binary actually carries the web UI"
# `rust-embed` reads `apps/web/dist` from disk in debug and bakes it in with
# `include_bytes!` in release, so the two profiles can disagree. An empty or
# missing `dist` still *compiles* clean in release — it just 404s every page —
# which is why this asserts the binary serves the shell rather than only that it
# builds. The integration test boots the real binary and checks for `<html>`.
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo test --locked -p kataan-server --release --test server",
]

[tasks.check]
description = "Run Rust format/tests/clippy and web format/type checks + build"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo fmt --check",
  "cargo test --locked",
  "cargo clippy --locked --all-targets -- -D warnings",
  # The API-only build has its own `#[cfg]` paths (the `/` explainer, the
  # startup hint). Nothing else compiles them, so they rot silently.
  "cargo clippy --locked -p kataan-server --no-default-features --all-targets -- -D warnings",
  "cargo test --locked -p kataan-server --no-default-features",
  "bun --filter @kataan/web format:check",
  "bun --filter @kataan/web check",
]

[tasks.server]
description = "Run Kataan with embedded UI. Usage: mise run server -- --vault /path/to/vault"
# The default `embed-ui` feature makes rust-embed require apps/web/dist at
# compile time, and dist is gitignored — without this a fresh clone fails with
# a derive error rather than anything actionable.
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo run -p kataan-server --",
]

[tasks.cli]
description = "Run the Kataan CLI. Usage: mise run cli -- validate /path/to/vault"
run = "cargo run -p kataan-cli --"
