experimental_monorepo_root = true

[monorepo]
config_roots = [
  "apps/web",
]

[tools]
bun = "1.3.10"
rust = { version = "1.91.1", components = "rustfmt,clippy" }

[env]
KATAAN_WEB_PORT = "3003"
KATAAN_API_PROXY_TARGET = "http://127.0.0.1:3001"

[tasks.install]
description = "Install JavaScript dependencies with Bun"
run = "bun install"

[tasks.dev-web]
description = "Run the Astro web app with hot reload"
run = "bun --filter @kataan/web dev"

[tasks.dev-web-install]
description = "Install dependencies and run the Astro web app with hot reload"
run = [
  "bun install",
  "bun --filter @kataan/web dev",
]

[tasks.clear-web]
description = "Stop processes using the default Astro dev port"
run = "lsof -ti :${KATAAN_WEB_PORT:-3000} | xargs -r kill"

[tasks.build-web]
description = "Install dependencies and build the Astro web app"
run = [
  "bun install",
  "bun --filter @kataan/web build",
]

[tasks.check-web]
description = "Install dependencies and run Astro type checks"
run = [
  "bun install",
  "bun --filter @kataan/web check",
]

[tasks.test]
description = "Build the web UI, then run all Rust tests"
# The server test boots the binary and asserts `/` serves the SPA, which the
# default `embed-ui` feature reads from apps/web/dist (gitignored). Without a
# prior web build that fails as "no HTML" rather than "you forgot to build".
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo test",
]

[tasks.build-release]
description = "Build the web UI, then all Rust binaries in release mode"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo build --workspace --release --bins",
]

[tasks.build-app]
description = "Build the web UI and the single kataan-server binary"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo build -p kataan-server --release",
]

[tasks.install-server]
description = "Build the UI and install kataan-server into ~/.cargo/bin"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo install --path crates/kataan-server --force",
]

[tasks.check]
description = "Run Rust format/tests/clippy and web format/type checks + build"
run = [
  "bun install",
  "bun --filter @kataan/web build",
  "cargo fmt --check",
  "cargo test",
  "cargo clippy --all-targets -- -D warnings",
  "bun --filter @kataan/web format:check",
  "bun --filter @kataan/web check",
]

[tasks.server]
description = "Run Kataan with embedded UI. Usage: mise run server -- --vault /path/to/vault"
run = "cargo run -p kataan-server --"

[tasks.cli]
description = "Run the Kataan CLI. Usage: mise run cli -- validate /path/to/vault"
run = "cargo run -p kataan-cli --"
