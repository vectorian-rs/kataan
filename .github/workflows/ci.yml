name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job installs bun packages and builds ~500 crates, any of which can run
# arbitrary build scripts. It needs nothing but read access.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchains pinned in mise.toml (bun + rust).
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Runs the same gate as `mise run check` locally: cargo fmt/test/clippy,
      # web prettier format check, astro type check, and web build.
      - name: Run checks
        run: mise run check
